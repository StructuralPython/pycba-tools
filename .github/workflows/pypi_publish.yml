# Builds the package and publishes it to PyPI with trusted publishing (OIDC) when a
# GitHub release is published. No API token is needed: PyPI trusts this workflow
# file (pypi_publish.yml) running in the "pypi" environment of this repository.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Build sdist and wheel
      run: uv build
    - name: Store the distributions
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pycba-tools/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
    - name: Download the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
